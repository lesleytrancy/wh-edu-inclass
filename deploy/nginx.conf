# ---------- 默认站点：控制台 + 大屏（原 IP/其他域名访问都落这里） ----------
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 550m;   # 课件上传最大 500MiB，留 50MiB 余量

