# ============================================================
# 多域名配置说明
# 1. 把下面的 example.com 全部换成你自己的域名
# 2. 去域名服务商（阿里云/腾讯云等）把三个域名都做 A 记录
#    指向服务器 IP：118.145.129.37
# 3. 国内服务器用域名访问 80 端口需要 ICP 备案，未备案请改用 IP+端口方案
# ============================================================

# ---------- 公共片段：后端 API + WebSocket 反代 ----------
# 三个域名共用同一套 /api 规则，保证任何一端登录、AI 功能都正常
# （nginx 不支持函数复用，这里用 include 文件避免抄三遍）

# ---------- 教师端：wh-teacher.stringx.top ----------
server {
    listen 80;
    server_name wh-teacher.stringx.top;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 550m;   # 课件上传最大 500MiB，留 50MiB 余量

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 打开教师域名根路径时，直接进教师端
    location = / {
        return 302 /teacher;
    }

    # 后端 API + WebSocket
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

